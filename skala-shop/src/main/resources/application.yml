spring:
  application:
    name: skala-shop

  datasource:
    url: jdbc:h2:mem:skala-shop;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # data.sql이 Hibernate 스키마 생성보다 먼저 실행되지 않도록 순서를 미룸
    defer-datasource-initialization: true

logging:
  level:
    org.hibernate.SQL: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info
